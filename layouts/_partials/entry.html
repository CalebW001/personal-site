<article class="post-entry"{{ with .Params.tags }} data-tags="{{ delimit (apply . "urlize" ".") " " }}"{{ end }}>
  <header class="entry-header">
    <h2>{{ .Title }}{{ if .Draft }} <span class="entry-draft">(draft)</span>{{ end }}</h2>
  </header>
  {{- with .Summary }}
  <div class="entry-content">
    <p>{{ . | plainify | htmlUnescape }}</p>
  </div>
  {{- end }}
  <footer class="entry-footer">
    {{ .Date | time.Format ":date_medium" }}{{ with .Params.tags }} · {{ delimit . ", " }}{{ end }}
  </footer>
  <a class="entry-link" aria-label="{{ .Title | plainify }}" href="{{ .Permalink }}"></a>
</article>
