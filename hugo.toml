baseURL = "https://calebwarzocha.dev/"
languageCode = "en-us"
title = "Caleb Warzocha"
theme = "PaperMod"
enableRobotsTXT = true

[pagination]
  pagerSize = 10

[taxonomies]
  tag = "tags"

[outputs]
  home = ["HTML", "RSS"]

[markup.highlight]
  codeFences = true
  guessSyntax = true
  style = "monokai"

[params]
  env = "production"
  description = "Caleb Warzocha - CTF writeups and projects."
  email = "warzochaec@gmail.com"
  profileImage = "img/profile.jpg"
  defaultTheme = "dark"
  disableThemeToggle = true
  mainSections = ["writeups", "projects"]
  ShowReadingTime = false
  hideMeta = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  ShowShareButtons = false

  [params.assets]
    disableHLJS = true

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/CalebW001"
  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/caleb-warzocha"
  [[params.socialIcons]]
    name = "tryhackme"
    title = "TryHackMe"
    url = "https://tryhackme.com/p/cewarzocha"

[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 10
  [[menu.main]]
    name = "Writeups"
    url = "/writeups/"
    weight = 20
  [[menu.main]]
    name = "Projects"
    url = "/projects/"
    weight = 30
  [[menu.main]]
    name = "Resume"
    url = "/resume/"
    weight = 40
